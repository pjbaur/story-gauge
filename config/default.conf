# story-sizer default config — shell-sourced (key=value, no spaces around =).
# Override per-project: put a .story-sizer.conf in CWD, set STORY_SIZER_CONFIG=path,
# or pass --config path. Override files only need the keys they change.
#
# Heading TEXT values are treated as regex (anchored at the start of the heading).
# Keyword lists are ERE alternations passed to `grep -ioE`.

# --- section headings (markdown) -------------------------------------------------
AC_HEADING="Acceptance Criteria"   # H2 by convention
DEVNOTES_HEADING="Dev Notes"       # H2
FILELIST_HEADING="File List"       # the author's changed-file list
FILELIST_LEVEL=3                   # heading depth of File List (### = 3)

# --- what counts as an acceptance criterion --------------------------------------
# Top-level numbered list items under the AC heading. Use '^[-*][[:space:]]' for bullets.
AC_ITEM_RE='^[0-9]+\.[[:space:]]'

# --- file path detection (ERE) ---------------------------------------------------
# Matches changed-file paths in the File List. Broaden for your stack/dirs.
FILE_PATH_RE='(src|lib|test|tests|app|pkg|internal|cmd|api)/[A-Za-z0-9_./-]+\.[A-Za-z0-9]+'
# Collapse a source file and its sibling test into one logical unit (sed -E, ;-joined).
TEST_SIBLING_SED='s/\.test\././; s/\.spec\././; s/\.int\././; s/_test\././'

# --- complexity keyword proxies (ERE alternations) -------------------------------
SM_RE='retry loop|poll loop|state machine|gate loop|control loop|fix-forward|saga|workflow engine|reducer'
MARKER_RE='CRITICAL|Do NOT|READ FIRST|IMPORTANT|WARNING|MUST NOT'
RACE_RE='microtask|macrotask|EPIPE|race condition|deadlock|deferred until|stay (alive|connected)|ordering (race|matters)|happens-before|out-of-order|reentran'

# --- gates (any one tripped => SPLIT) --------------------------------------------
MAX_ACS=6
MAX_FILES=3
MAX_SM=1
MAX_MARKERS=3
MAX_RACE=0
WARN_DEVNOTES_LINES=120
